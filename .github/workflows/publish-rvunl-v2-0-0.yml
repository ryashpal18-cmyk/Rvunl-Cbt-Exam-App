name: Verify RVUNL release download names
on:
  push:
    branches: [publish-rvunl-v2-0-0]
    paths: ['.github/workflows/publish-rvunl-v2-0-0.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Match the differential update blockmap to the installer
        run: |
          set -euo pipefail
          gh release download v2.0.0 --repo "$REPO" --pattern latest.yml
          installer=$(ruby -ryaml -e 'puts YAML.load_file("latest.yml").fetch("path")')
          assets=$(gh api "repos/$REPO/releases/448102253/assets")
          jq -e --arg n "$installer" 'any(.[]; .name == $n and .state == "uploaded")' <<<"$assets" >/dev/null
          blockmap="$installer.blockmap"
          if ! jq -e --arg n "$blockmap" 'any(.[]; .name == $n and .state == "uploaded")' <<<"$assets" >/dev/null; then
            id=$(jq -er '.[] | select(.name | endswith(".blockmap")) | .id' <<<"$assets")
            gh api --method PATCH "repos/$REPO/releases/assets/$id" -f name="$blockmap" --jq .name
          fi
          jq -r --arg i "$installer" '. as $all | .[] | select(.name != $i and (.name | startswith("RVUNL.CBT.")) and (.name | endswith(".exe"))) as $candidate | select(any($all[]; .id != $candidate.id and .digest == $candidate.digest)) | .id' <<<"$assets" |
          while read -r id; do gh api --method DELETE "repos/$REPO/releases/assets/$id"; done
