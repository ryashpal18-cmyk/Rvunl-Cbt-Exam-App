name: Retry RVUNL v2.0.0 release
on:
  push:
    branches: [publish-rvunl-v2-0-0]
    paths: ['.github/workflows/publish-rvunl-v2-0-0.yml']
permissions:
  contents: write
  actions: write
jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Update the unpublished tag and dispatch Windows packaging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OLD: '7c5a1620f14516005f160776a1bfe3266aa3fbe2'
          TARGET: '4c541f0bc5f4f750104d0db91375a95eca21ed0f'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" = "$TARGET"
          test "$(gh api "repos/$REPO/git/ref/tags/v2.0.0" --jq .object.sha)" = "$OLD"
          test -z "$(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.tag_name == "v2.0.0") | .id')"
          gh api --method PATCH "repos/$REPO/git/refs/tags/v2.0.0" -f sha="$TARGET" -F force=true
          gh workflow run build-windows.yml --repo "$REPO" --ref v2.0.0
