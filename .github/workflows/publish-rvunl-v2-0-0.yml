name: Start RVUNL v2.0.0 release
on:
  push:
    branches: [publish-rvunl-v2-0-0]
    paths: ['.github/workflows/publish-rvunl-v2-0-0.yml']
permissions:
  contents: write
  actions: write
jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Tag verified main commit and run Windows release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: '7c5a1620f14516005f160776a1bfe3266aa3fbe2'
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          test "$actual" = "$TARGET"
          version=$(gh api "repos/$REPO/contents/package.json?ref=$TARGET" --jq .content | base64 -d | jq -r .version)
          test "$version" = '2.0.0'
          gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/v$version" -f sha="$TARGET"
          gh workflow run build-windows.yml --repo "$REPO" --ref "v$version"
