name: Build RVUNL CBT Windows EXE

on:
  push:
    branches: [main, 'rvunl-v2-update']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    concurrency:
      group: windows-${{ github.ref }}
      cancel-in-progress: false
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version."
          }

      - name: Build frontend and Electron app
        run: npm run build

      - name: Verify Hindi PDF and compact UI on Windows
        run: npx electron scripts/check-native-pdf.cjs

      - name: Package Windows executables
        run: npx electron-builder --win --x64 --publish never

      - name: Verify installer and portable executables
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($files.Count -lt 2) { throw 'Expected NSIS and portable executables.' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RVUNL-CBT-Mock-App-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/Hindi-results-check.pdf
            release/*-check.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/latest.yml
          files=(release/*.exe release/*.blockmap release/latest.yml)
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${files[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
