name: Build RVUNL CBT Windows EXE

on:
  push:
    branches: [main, 'rvunl-v2-update']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version."
          }

      - name: Build frontend and Electron app
        run: npm run build

      - name: Package Windows executables
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx electron-builder --win --x64 --publish never

      - name: Package and publish Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always -c.publish.releaseType=release

      - name: Verify installer and portable executables
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($files.Count -lt 2) { throw 'Expected NSIS and portable executables.' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RVUNL-CBT-Mock-App-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
