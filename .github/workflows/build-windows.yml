name: Build RVUNL CBT Windows EXE

on:
  push:
    branches: [main, 'rvunl-v2-update']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    concurrency:
      group: windows-${{ github.ref }}
      cancel-in-progress: false
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version."
          }

      - name: Build frontend and Electron app
        run: npm run build

      - name: Verify Hindi PDF and compact UI on Windows
        run: npx electron scripts/check-native-pdf.cjs

      - name: Package Windows executables
        run: npx electron-builder --win --x64 --publish never

      - name: Verify installer and portable executables
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($files.Count -lt 2) { throw 'Expected NSIS and portable executables.' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RVUNL-CBT-Mock-App-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/Hindi-results-check.pdf
            release/*-check.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$state" == "false" ]]; then
            echo "$tag is already published."
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const yaml = require('js-yaml');
          const version = require('./package.json').version;
          const metadata = fs.readFileSync('release/latest.yml');
          if (metadata.includes(0)) throw new Error('Update metadata contains null bytes.');
          const info = yaml.load(metadata.toString('utf8'));
          const installer = `RVUNL-CBT-Mock-Exam-Setup-${version}.exe`;
          if (info.version !== version || info.path !== installer) throw new Error('Update metadata version or installer mismatch.');
          const bytes = fs.readFileSync(`release/${installer}`);
          const checksum = crypto.createHash('sha512').update(bytes).digest('base64');
          if (info.sha512 !== checksum || !info.files.some(file => file.url === installer && file.sha512 === checksum && file.size === bytes.length)) throw new Error('Update metadata checksum mismatch.');
          console.log(`Verified UTF-8 update metadata and installer checksum for v${version}.`);
          NODE
          files=(release/*.exe release/*.blockmap release/latest.yml)
          if [[ -z "$state" ]]; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest
